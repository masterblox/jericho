appId: com.jericho.core
productName: Jericho
copyright: Copyright 2026

directories:
  output: dist-electron
  buildResources: electron

afterSign: electron/notarize.mjs

files:
  - electron/dist/**/*
  - bridge/dist/**/*
  - frontend/dist/**/*
  - package.json

asar: true
asarUnpack:
  - electron/dist/jericho-keychain-helper
  - bridge/dist/**/*
  - frontend/dist/**/*

mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  icon: electron/icon.icns
  extendInfo:
    NSCameraUsageDescription: Jericho uses the camera locally for hand gesture control and calibration.
    NSMicrophoneUsageDescription: Jericho uses the microphone for clap wake, voice turns, and local audio calibration.
  target:
    - dmg
    - zip

dmg:
  title: Jericho ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

publish:
  provider: github
  owner: masterblox
  repo: jericho
  releaseType: draft
